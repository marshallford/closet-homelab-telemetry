receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # These describe the scrape rather than the machine. Dropping them loses
  # nothing: up still reports whether the target is alive, and collector health
  # comes from otelcol_* self-telemetry.
  filter/scaffolding:
    error_mode: ignore
    metrics:
      metric:
      - 'IsMatch(name, "^node_scrape_collector_")'
      - 'IsMatch(name, "^scrape_")'

  # Source sanitation, not semantic conventions. Hardware reports unset
  # thresholds as out-of-range markers rather than omitting them: absolute zero
  # for a minimum, five figures for a maximum.
  filter/sentinels:
    error_mode: ignore
    metrics:
      datapoint:
      - 'IsMatch(metric.name, "^node_hwmon_temp_") and value_double <= -273'
      - 'IsMatch(metric.name, "^node_hwmon_temp_") and value_double >= 1000'

  transform/semconv:
    error_mode: ignore
    metric_statements:
    # PVE is not configurable, so its host identity is normalized here. Nodes
    # declare their own identity, which is why nothing else is set.
    - context: resource
      statements:
      - 'set(attributes["host.name"], attributes["proxmox.node"]) where attributes["proxmox.node"] != nil'

    # PVE repeats the resource-level proxmox.node on every datapoint.
    - context: datapoint
      statements:
      - 'delete_key(attributes, "node") where resource.attributes["proxmox.node"] != nil'

    # hwmon temperatures -> hw.* attributes. Runs before the rename below,
    # which is why these match on the original metric name -- and every one is
    # scoped to it, so native hw.temperature from a future hardware scraper
    # passes through untouched rather than being rewritten by these.
    #
    # chip is a sysfs path rather than a driver name, so it distinguishes two
    # NVMe drives where "nvme" would not. hw.name and hw.sensor_location are
    # left unset: the driver name and the sensor label live in separate info
    # metrics, and OTTL cannot read one metric from another. Both are
    # currently Recommended rather than Required for hw.temperature.
    - context: datapoint
      conditions:
      - 'IsMatch(metric.name, "^node_hwmon_temp_(celsius|max_celsius|crit_celsius|lcrit_celsius|min_celsius)$")'
      statements:
      - 'set(attributes["hw.id"], Concat(["hwmon", attributes["chip"], attributes["sensor"]], "/")) where attributes["chip"] != nil and attributes["sensor"] != nil'
      - 'set(attributes["hw.parent"], Concat(["hwmon", attributes["chip"]], "/")) where attributes["chip"] != nil'
      - 'set(attributes["hw.limit_type"], "high.critical") where metric.name == "node_hwmon_temp_crit_celsius"'
      - 'set(attributes["hw.limit_type"], "high.degraded") where metric.name == "node_hwmon_temp_max_celsius"'
      - 'set(attributes["hw.limit_type"], "low.critical") where metric.name == "node_hwmon_temp_lcrit_celsius"'
      - 'set(attributes["hw.limit_type"], "low.degraded") where metric.name == "node_hwmon_temp_min_celsius"'
      # Guarded on hw.id, not on chip and sensor themselves: statements run in
      # order, so deleting chip first would falsify a chip != nil test on the
      # next line and strand sensor. hw.id is set only when both were present,
      # and nothing deletes it, so it is the stable form of the same check.
      - 'delete_key(attributes, "chip") where attributes["hw.id"] != nil'
      - 'delete_key(attributes, "sensor") where attributes["hw.id"] != nil'

    # hwmon temperatures -> hw.* metric names and units.
    #
    # No hw.type on either: semconv defines it for hw.status, where it names
    # what a state describes, not for the numeric temperature metrics.
    #
    # node_hwmon_power_watt stays source-native. hw.power does require
    # hw.type, and hwmon does not reliably say what component a power rail
    # measures -- on an APU the amdgpu rail includes CPU draw -- so it keeps
    # its own name and its chip and sensor labels rather than half-claiming
    # the convention.
    - context: metric
      conditions:
      - 'IsMatch(name, "^node_hwmon_temp_(celsius|max_celsius|crit_celsius|lcrit_celsius|min_celsius)$")'
      statements:
      - 'set(unit, "Cel")'
      - 'set(name, "hw.temperature") where name == "node_hwmon_temp_celsius"'
      - 'set(name, "hw.temperature.limit") where IsMatch(name, "^node_hwmon_temp_(max|crit|lcrit|min)_celsius$")'

  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  prometheus_remote_write:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
    # Sized to absorb a node collector draining its queue in a burst. Memory
    # only: a wal would need a root init container to chown the volume, and
    # Prometheus running beside this collector makes that outage unlikely.
    remote_write_queue:
      queue_size: 100_000
    # Outlast a Prometheus restart, bounded so stuck consumers cannot eat RAM.
    retry_on_failure:
      max_elapsed_time: 30m

service:
  # Self-telemetry is emitted by the service layer, not a receiver, so it
  # bypasses this collector's own pipeline. Push it back into the OTLP
  # receiver so it takes the same path to Prometheus as everything else.
  telemetry:
    resource:
      attributes:
      # Both tiers run otelcol-contrib, so the namespace is what separates
      # them: job becomes central/otelcol-contrib here, node/otelcol-contrib
      # on a node.
      - name: service.namespace
        value: central
      # The runtime sets HOSTNAME to the container ID, so replicas are distinct
      # without configuring anything per replica, and the value survives a
      # process restart. A replaced container is genuinely a new instance.
      - name: service.instance.id
        value: "${env:HOSTNAME}"
    metrics:
      readers:
      - periodic:
          # Milliseconds -- the only interval in this project not a duration.
          interval: 30000
          exporter:
            otlp:
              protocol: grpc
              endpoint: http://localhost:4317

  pipelines:
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - filter/scaffolding
      - filter/sentinels
      - transform/semconv
      - batch
      exporters:
      - prometheus_remote_write
