name: proxmox-monitoring

services:
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.159.0
    container_name: otel-collector
    ports:
    - "4317:4317"
    - "4318:4318"
    volumes:
    - ./config/workstation/otel-collector.yaml:/etc/otel-collector-config.yaml:ro,z
    command:
    - "--config=/etc/otel-collector-config.yaml"
    networks:
    - monitoring
    restart: unless-stopped
    depends_on:
    - prometheus

  prometheus:
    image: docker.io/prom/prometheus:v3.14.0
    container_name: prometheus
    ports:
    - "127.0.0.1:9090:9090"
    volumes:
    - ./config/workstation/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro,z
    - prometheus_data:/prometheus
    command:
    - '--config.file=/etc/prometheus/prometheus.yaml'
    - '--storage.tsdb.path=/prometheus'
    - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}'
    - '--web.enable-remote-write-receiver'
    networks:
    - monitoring
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:13.2.0
    container_name: grafana
    ports:
    - "127.0.0.1:3000:3000"
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=admin
    - GF_RENDERING_SERVER_URL=http://renderer:8081/render
    - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
    - GF_RENDERING_RENDERER_TOKEN=${RENDERER_TOKEN:-local-render}
    - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
    - grafana_data:/var/lib/grafana
    - ./config/workstation/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro,z
    - ./config/workstation/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/rendered.yaml:ro,z
    - ./dashboards/rendered:/var/lib/grafana/dashboards:ro,z
    networks:
    - monitoring
    depends_on:
    - prometheus
    - renderer
    restart: unless-stopped

  renderer:
    image: docker.io/grafana/grafana-image-renderer:v5.12.2
    container_name: renderer
    environment:
    - AUTH_TOKEN=${RENDERER_TOKEN:-local-render}
    - TZ=${TZ:-America/Chicago}
    networks:
    - monitoring
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
