# Deployed to /etc/systemd/system/otelcol-contrib.service.d/endpoint.conf
#
# EnvironmentFile is additive, so this is read alongside the one the package
# ships. The referenced file is written per-node at deploy time.

[Service]
EnvironmentFile=/etc/otelcol-contrib/endpoint.env
# %H and %m are the hostname and machine ID; systemd fills them in, so the
# collector config stays identical on every node.
Environment="NODE_HOST=%H"
Environment="NODE_MACHINE_ID=%m"
